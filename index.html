<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickTask Nigeria - Earn Money by Completing Micro-Tasks</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 antialiased font-sans min-h-screen pb-12" x-data="taskApp()">

    <!-- TOP NAVIGATION & WALLET BAR -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-md">
                    <i class="fa-solid fa-bolt text-lg"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-lg leading-tight text-gray-900">QuickTask</h1>
                    <span class="text-[10px] bg-emerald-100 text-emerald-800 font-bold px-1.5 py-0.5 rounded-full uppercase tracking-wider">Nigeria</span>
                </div>
            </div>

            <!-- Wallet Stats Badge -->
            <div class="bg-gray-100 border border-gray-200 rounded-xl px-3 py-1 text-right shadow-inner">
                <div class="text-xs font-bold text-emerald-600 flex items-center justify-end space-x-1">
                    <span>₦</span><span x-text="wallet.balance.toLocaleString()"></span>
                </div>
                <div class="text-[10px] text-amber-600 font-medium">
                    +₦<span x-text="wallet.pending.toLocaleString()"></span> pending
                </div>
            </div>
        </div>
    </header>

    <!-- HERO BANNER -->
    <section class="max-w-md mx-auto px-4 pt-4">
        <div class="bg-gradient-to-r from-indigo-600 to-violet-600 rounded-2xl p-5 text-white shadow-lg relative overflow-hidden">
            <div class="relative z-10">
                <h2 class="text-xl font-bold mb-1">Perform Small Tasks & Get Paid Instantly</h2>
                <p class="text-xs text-indigo-100 leading-relaxed">Select micro-jobs below, follow instructions, submit proof, and receive wallet credits.</p>
                
                <div class="mt-4 flex space-x-2">
                    <button @click="showPostModal = true" class="bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-semibold px-3 py-2 rounded-lg transition shadow-sm flex items-center space-x-1">
                        <i class="fa-solid fa-plus-circle"></i>
                        <span>Post a Task</span>
                    </button>
                    <button @click="activeTab = 'submissions'" class="bg-white/20 hover:bg-white/30 text-white text-xs font-semibold px-3 py-2 rounded-lg transition backdrop-blur-sm flex items-center space-x-1">
                        <i class="fa-solid fa-list-check"></i>
                        <span>My Proofs</span>
                    </button>
                </div>
            </div>
            <i class="fa-solid fa-coins absolute -right-3 -bottom-3 text-7xl text-white/10"></i>
        </div>
    </section>

    <!-- NAVIGATION TABS -->
    <section class="max-w-md mx-auto px-4 mt-5">
        <div class="flex space-x-2 border-b border-gray-200 text-xs font-medium pb-2">
            <button @click="activeTab = 'tasks'" :class="activeTab === 'tasks' ? 'text-indigo-600 border-b-2 border-indigo-600 font-bold' : 'text-gray-500 hover:text-gray-700'" class="pb-2 px-1 transition">
                <i class="fa-solid fa-briefcase mr-1"></i> Available Tasks
            </button>
            <button @click="activeTab = 'submissions'" :class="activeTab === 'submissions' ? 'text-indigo-600 border-b-2 border-indigo-600 font-bold' : 'text-gray-500 hover:text-gray-700'" class="pb-2 px-1 transition">
                <i class="fa-solid fa-clock-rotate-left mr-1"></i> Submissions (<span x-text="submissions.length"></span>)
            </button>
        </div>
    </section>

    <!-- TASK DISCOVERY TAB -->
    <main class="max-w-md mx-auto px-4 mt-4" x-show="activeTab === 'tasks'">
        
        <!-- Category Filter Pills -->
        <div class="flex space-x-2 overflow-x-auto pb-2 scrollbar-none">
            <template x-for="cat in categories" :key="cat">
                <button @click="selectedCategory = cat" 
                        :class="selectedCategory === cat ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white text-gray-600 border border-gray-200 hover:bg-gray-100'"
                        class="text-xs font-semibold px-3 py-1.5 rounded-full whitespace-nowrap transition">
                    <span x-text="cat"></span>
                </button>
            </template>
        </div>

        <!-- Task List -->
        <div class="space-y-3 mt-3">
            <template x-for="task in filteredTasks" :key="task.id">
                <div class="bg-white rounded-xl p-4 border border-gray-100 shadow-sm hover:shadow-md transition">
                    <div class="flex items-start justify-between">
                        <div>
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-indigo-50 text-indigo-600" x-text="task.category"></span>
                            <h3 class="font-bold text-sm text-gray-900 mt-2" x-text="task.title"></h3>
                            <p class="text-xs text-gray-500 mt-1" x-text="task.description"></p>
                        </div>
                        <div class="text-right ml-2 flex-shrink-0">
                            <span class="font-extrabold text-emerald-600 text-sm">₦<span x-text="task.reward"></span></span>
                        </div>
                    </div>
                    
                    <button @click="openTaskModal(task)" class="mt-4 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs py-2.5 rounded-lg shadow transition flex items-center justify-center space-x-1.5">
                        <i class="fa-solid fa-paper-plane"></i>
                        <span>Perform Task & Earn</span>
                    </button>
                </div>
            </template>
        </div>
    </main>

    <!-- SUBMISSIONS / HISTORY TAB -->
    <main class="max-w-md mx-auto px-4 mt-4" x-show="activeTab === 'submissions'">
        <div class="space-y-3">
            <template x-if="submissions.length === 0">
                <div class="bg-white rounded-xl p-8 text-center text-gray-400 border border-dashed border-gray-200">
                    <i class="fa-regular fa-folder-open text-3xl mb-2"></i>
                    <p class="text-xs">No task submissions yet. Complete tasks to see earnings here!</p>
                </div>
            </template>

            <template x-for="sub in submissions" :key="sub.id">
                <div class="bg-white rounded-xl p-4 border border-gray-100 shadow-sm flex items-center justify-between">
                    <div>
                        <h4 class="font-bold text-xs text-gray-800" x-text="sub.taskTitle"></h4>
                        <p class="text-[10px] text-gray-400 mt-0.5" x-text="sub.date"></p>
                        <span class="inline-block mt-1 text-[10px] font-bold px-2 py-0.5 rounded-md bg-amber-100 text-amber-800" x-text="sub.status"></span>
                    </div>
                    <div class="text-right">
                        <span class="font-extrabold text-emerald-600 text-xs">+₦<span x-text="sub.reward"></span></span>
                    </div>
                </div>
            </template>
        </div>
    </main>

    <!-- PROOF SUBMISSION MODAL -->
    <div x-show="selectedTask !== null" x-cloak class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 shadow-2xl relative">
            <button @click="selectedTask = null" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            
            <template x-if="selectedTask">
                <div>
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-indigo-50 text-indigo-600" x-text="selectedTask.category"></span>
                    <h3 class="font-bold text-base text-gray-900 mt-1" x-text="selectedTask.title"></h3>
                    <p class="text-xs text-gray-500 mt-1" x-text="selectedTask.instructions"></p>
                    
                    <div class="mt-4 bg-emerald-50 border border-emerald-100 p-3 rounded-lg flex items-center justify-between">
                        <span class="text-xs text-emerald-800 font-semibold">Payout Reward:</span>
                        <span class="font-extrabold text-emerald-700 text-sm">₦<span x-text="selectedTask.reward"></span></span>
                    </div>

                    <form @submit.prevent="submitProof()" class="mt-4 space-y-3">
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Verification Proof (Username or ID)</label>
                            <input type="text" x-model="proofInput" required placeholder="e.g. @your_handle or User #10293" class="w-full text-xs px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        
                        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs py-3 rounded-lg shadow transition flex items-center justify-center space-x-1">
                            <i class="fa-solid fa-check-circle"></i>
                            <span>Submit Proof for Review</span>
                        </button>
                    </form>
                </div>
            </template>
        </div>
    </div>

    <!-- CREATE/POST TASK MODAL (EMPLOYER PORTAL) -->
    <div x-show="showPostModal" x-cloak class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 shadow-2xl relative">
            <button @click="showPostModal = false" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            
            <h3 class="font-bold text-base text-gray-900">Post a Micro-Task</h3>
            <p class="text-xs text-gray-500 mt-0.5">Hire Nigerians to perform tasks for your business or channel.</p>

            <form @submit.prevent="addNewTask()" class="mt-4 space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Task Category</label>
                    <select x-model="newTask.category" class="w-full text-xs px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="Social Media">Social Media</option>
                        <option value="Mobile Apps">Mobile Apps</option>
                        <option value="Reviews">Reviews</option>
                        <option value="Surveys">Surveys</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Task Title</label>
                    <input type="text" x-model="newTask.title" required placeholder="e.g. Follow X Account & Retweet" class="w-full text-xs px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Instructions for Worker</label>
                    <textarea x-model="newTask.instructions" required rows="2" placeholder="Describe step-by-step what workers must do..." class="w-full text-xs px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Payout per Worker (₦)</label>
                    <input type="number" x-model.number="newTask.reward" min="50" step="50" required placeholder="150" class="w-full text-xs px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs py-3 rounded-lg shadow transition flex items-center justify-center space-x-1">
                    <i class="fa-solid fa-plus-circle"></i>
                    <span>Publish Task Live</span>
                </button>
            </form>
        </div>
    </div>

    <!-- ALPINE.JS APP CONTROLLER -->
    <script>
        function taskApp() {
            return {
                activeTab: 'tasks',
                selectedCategory: 'All',
                categories: ['All', 'Social Media', 'Mobile Apps', 'Reviews', 'Surveys'],
                selectedTask: null,
                showPostModal: false,
                proofInput: '',
                
                wallet: JSON.parse(localStorage.getItem('qt_wallet')) || { balance: 1200, pending: 250 },
                submissions: JSON.parse(localStorage.getItem('qt_submissions')) || [],
                
                newTask: {
                    category: 'Social Media',
                    title: '',
                    instructions: '',
                    reward: 150
                },

                tasks: JSON.parse(localStorage.getItem('qt_tasks')) || [
                    {
                        id: 1,
                        category: 'Social Media',
                        title: 'Subscribe to YouTube Channel & Ring Bell',
                        description: 'Subscribe and turn on all post notifications for a local channel.',
                        instructions: 'Click the link, hit Subscribe, enable all notifications, and submit your YouTube handle.',
                        reward: 150
                    },
                    {
                        id: 2,
                        category: 'Mobile Apps',
                        title: 'Download & Test FinTech App',
                        description: 'Install app from Play Store and keep for 24 hours.',
                        instructions: 'Search for the app on Play Store, install it, open it once, and submit your phone number.',
                        reward: 450
                    },
                    {
                        id: 3,
                        category: 'Reviews',
                        title: 'Leave 5-Star Review on Google Maps',
                        description: 'Write a genuine positive review for a local store.',
                        instructions: 'Visit the Google Maps listing, leave 5 stars with a brief review, and submit your Google name.',
                        reward: 300
                    },
                    {
                        id: 4,
                        category: 'Surveys',
                        title: 'Complete 3-Minute Consumer Survey',
                        description: 'Share your buying preferences in Lagos/Abuja.',
                        instructions: 'Answer all 10 questions in the Google form and submit your email used.',
                        reward: 200
                    }
                ],

                get filteredTasks() {
                    if (this.selectedCategory === 'All') return this.tasks;
                    return this.tasks.filter(t => t.category === this.selectedCategory);
                },

                openTaskModal(task) {
                    this.selectedTask = task;
                    this.proofInput = '';
                },

                submitProof() {
                    if (!this.proofInput.trim()) return;

                    // Add pending earnings
                    this.wallet.pending += this.selectedTask.reward;
                    
                    // Add submission record
                    this.submissions.unshift({
                        id: Date.now(),
                        taskTitle: this.selectedTask.title,
                        reward: this.selectedTask.reward,
                        status: 'Under Review',
                        date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    });

                    // Save persistence
                    localStorage.setItem('qt_wallet', JSON.stringify(this.wallet));
                    localStorage.setItem('qt_submissions', JSON.stringify(this.submissions));

                    alert('Proof submitted! ₦' + this.selectedTask.reward + ' added to pending balance.');
                    this.selectedTask = null;
                },

                addNewTask() {
                    if (!this.newTask.title || !this.newTask.instructions) return;

                    const createdTask = {
                        id: Date.now(),
                        category: this.newTask.category,
                        title: this.newTask.title,
                        description: this.newTask.instructions.substring(0, 60) + '...',
                        instructions: this.newTask.instructions,
                        reward: Number(this.newTask.reward)
                    };

                    this.tasks.unshift(createdTask);
                    localStorage.setItem('qt_tasks', JSON.stringify(this.tasks));

                    this.showPostModal = false;
                    this.newTask = { category: 'Social Media', title: '', instructions: '', reward: 150 };
                    alert('Task published successfully!');
                }
            }
        }
    </script>
</body>
</html>
