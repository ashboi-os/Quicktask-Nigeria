<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickTask Nigeria - Micro-Tasking Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 antialiased font-sans min-h-screen pb-20" x-data="taskApp()">

    <!-- AUTHENTICATION & EMAIL VERIFICATION SCREEN -->
    <div x-show="!isLoggedIn" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-indigo-900 via-indigo-800 to-purple-900">
        <div class="bg-white w-full max-w-md rounded-2xl p-6 shadow-2xl">
            <div class="text-center mb-6">
                <div class="w-12 h-12 bg-indigo-600 rounded-2xl flex items-center justify-center text-white shadow-lg mx-auto mb-2">
                    <i class="fa-solid fa-bolt text-2xl"></i>
                </div>
                <h2 class="text-2xl font-black text-gray-900">QuickTask <span class="text-indigo-600">Nigeria</span></h2>
                <p class="text-xs text-emerald-600 font-bold mt-1">🎁 Get ₦1,500 Welcome Bonus Instantly!</p>
            </div>

            <template x-if="!pendingVerification">
                <div>
                    <div class="flex border-b border-gray-200 mb-5 text-xs font-bold text-center">
                        <button @click="authMode = 'login'" :class="authMode === 'login' ? 'border-b-2 border-indigo-600 text-indigo-600' : 'text-gray-400'" class="w-1/2 pb-2 transition">Log In</button>
                        <button @click="authMode = 'signup'" :class="authMode === 'signup' ? 'border-b-2 border-indigo-600 text-indigo-600' : 'text-gray-400'" class="w-1/2 pb-2 transition">Create Account</button>
                    </div>

                    <form x-show="authMode === 'login'" @submit.prevent="handleLogin()" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Email Address</label>
                            <input type="email" x-model="authEmail" required placeholder="worker@example.com" class="w-full text-xs px-3.5 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Password</label>
                            <input type="password" x-model="authPassword" required placeholder="••••••••" class="w-full text-xs px-3.5 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs py-3 rounded-lg shadow transition flex items-center justify-center space-x-1">
                            <i class="fa-solid fa-right-to-bracket"></i>
                            <span>Log In to Account</span>
                        </button>
                    </form>

                    <form x-show="authMode === 'signup'" @submit.prevent="initiateSignUp()" class="space-y-3">
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Full Name</label>
                            <input type="text" x-model="authName" required placeholder="e.g. Chidi Okeke" class="w-full text-xs px-3.5 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Email Address</label>
                            <input type="email" x-model="authEmail" required placeholder="worker@example.com" class="w-full text-xs px-3.5 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Password</label>
                            <input type="password" x-model="authPassword" required placeholder="••••••••" class="w-full text-xs px-3.5 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        <button type="submit" :disabled="isSendingCode" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs py-3 rounded-lg shadow transition flex items-center justify-center space-x-1">
                            <i class="fa-solid opacity-75" :class="isSendingCode ? 'fa-spinner fa-spin' : 'fa-paper-plane'"></i>
                            <span x-text="isSendingCode ? 'Sending Verification Code...' : 'Send Verification Code to Email'"></span>
                        </button>
                    </form>
                </div>
            </template>

            <template x-if="pendingVerification">
                <div class="text-center space-y-4">
                    <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-xl">
                        <i class="fa-solid fa-envelope-circle-check"></i>
                    </div>
                    <h3 class="font-bold text-gray-900 text-base">Check Your Email Inbox</h3>
                    <p class="text-xs text-gray-500">Verification code sent to <span class="font-bold text-indigo-600" x-text="authEmail"></span>.</p>
                    <input type="text" x-model="verificationCodeInput" maxlength="4" placeholder="Enter code" class="w-40 text-center text-lg font-bold tracking-widest px-3 py-2 border border-gray-300 rounded-lg mx-auto block focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    <button @click="verifyEmailCode()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs py-3 rounded-lg shadow transition">
                        Verify & Claim ₦1,500 Bonus
                    </button>
                </div>
            </template>
        </div>
    </div>

    <!-- MAIN APP DASHBOARD -->
    <div x-show="isLoggedIn" x-cloak>
        <header class="bg-white border-b border-gray-200 sticky top-0 z-30 shadow-sm">
            <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <div class="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-md">
                        <i class="fa-solid fa-bolt text-lg"></i>
                    </div>
                    <div>
                        <h1 class="font-extrabold text-lg leading-tight text-gray-900">QuickTask</h1>
                        <div class="flex items-center space-x-1">
                            <span class="text-[10px] bg-emerald-100 text-emerald-800 font-bold px-1.5 py-0.5 rounded-full uppercase tracking-wider">Nigeria</span>
                            <span class="text-[10px] text-gray-400 font-semibold truncate max-w-[90px]" x-text="currentUser.name"></span>
                        </div>
                    </div>
                </div>

                <div class="flex items-center space-x-2">
                    <button @click="showWithdrawModal = true" class="bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 rounded-xl px-3 py-1 text-right shadow-inner transition">
                        <div class="text-xs font-extrabold text-emerald-700 flex items-center justify-end space-x-0.5">
                            <span>₦</span><span x-text="wallet.balance.toLocaleString()"></span>
                        </div>
                        <div class="text-[9px] text-indigo-600 font-semibold">
                            <i class="fa-solid fa-wallet"></i> Withdraw
                        </div>
                    </button>
                </div>
            </div>
        </header>

        <!-- 1. HOME TAB -->
        <main class="max-w-md mx-auto px-4 pt-4" x-show="currentNav === 'home'">
            <div class="bg-gradient-to-r from-indigo-600 to-violet-600 rounded-2xl p-5 text-white shadow-lg relative overflow-hidden mb-4">
                <div class="relative z-10">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-xs text-indigo-200 font-semibold">Tier: <strong class="text-amber-300 uppercase" x-text="currentUser.tier || 'Free Tier'"></strong></span>
                        <span class="text-[10px] bg-white/25 px-2 py-0.5 rounded-full backdrop-blur-sm">Payout: 20th Monthly</span>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-3 mb-3">
                        <div class="bg-white/10 p-2.5 rounded-xl backdrop-blur-sm border border-white/10">
                            <span class="text-[10px] text-indigo-200 block">Total Balance</span>
                            <span class="text-base font-extrabold">₦<span x-text="wallet.balance.toLocaleString()"></span></span>
                        </div>
                        <div class="bg-white/10 p-2.5 rounded-xl backdrop-blur-sm border border-white/10">
                            <span class="text-[10px] text-indigo-200 block">Daily Limit</span>
                            <span class="text-base font-extrabold"><span x-text="todayTaskCount"></span> / <span x-text="dailyLimit === 999 ? '∞' : dailyLimit"></span> Done</span>
                        </div>
                    </div>

                    <div class="flex space-x-2">
                        <button @click="showUpgradeModal = true" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold py-2 rounded-lg transition shadow-sm flex items-center justify-center space-x-1">
                            <i class="fa-solid fa-crown"></i>
                            <span>Upgrade Tier</span>
                        </button>
                        <button @click="showReferralModal = true" class="bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-semibold px-3 py-2 rounded-lg transition shadow-sm flex items-center space-x-1">
                            <i class="fa-solid fa-users"></i>
                            <span>Refer & Earn</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3 mb-4">
                <button @click="currentNav = 'earn'" class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm text-left hover:border-indigo-500 transition">
                    <i class="fa-solid fa-briefcase text-indigo-600 text-xl mb-1"></i>
                    <h4 class="font-bold text-xs text-gray-900">Available Tasks</h4>
                    <p class="text-[10px] text-gray-400">Earn ₦200 per job</p>
                </button>
                <button @click="showWithdrawModal = true" class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm text-left hover:border-emerald-500 transition">
                    <i class="fa-solid fa-building-columns text-emerald-600 text-xl mb-1"></i>
                    <h4 class="font-bold text-xs text-gray-900">Bank Withdrawal</h4>
                    <p class="text-[10px] text-gray-400">Min ₦7,000 threshold</p>
                </button>
            </div>
        </main>

        <!-- 2. EARN TAB WITH DIRECT OUTBOUND LINKS -->
        <main class="max-w-md mx-auto px-4 pt-4" x-show="currentNav === 'earn'">
            <div class="space-y-3">
                <template x-for="task in filteredTasks" :key="task.id">
                    <div class="bg-white rounded-xl p-4 border border-gray-100 shadow-sm hover:shadow-md transition">
                        <div class="flex items-start justify-between">
                            <div>
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-indigo-50 text-indigo-600" x-text="task.category"></span>
                                <h3 class="font-bold text-sm text-gray-900 mt-2" x-text="task.title"></h3>
                                <p class="text-xs text-gray-500 mt-1" x-text="task.description"></p>
                            </div>
                            <span class="font-extrabold text-emerald-600 text-sm ml-2">₦200</span>
                        </div>
                        
                        <div class="mt-3 flex gap-2">
                            <a :href="task.actionUrl" target="_blank" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-bold py-2 rounded-lg text-center transition flex items-center justify-center gap-1">
                                <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i> Open Task Link
                            </a>
                            <button @click="openTaskModal(task)" :disabled="todayTaskCount >= dailyLimit" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs py-2 rounded-lg transition">
                                Submit Proof
                            </button>
                        </div>
                    </div>
                </template>
            </div>
        </main>

        <!-- 3. PROFILE TAB -->
        <main class="max-w-md mx-auto px-4 pt-4" x-show="currentNav === 'profile'">
            <div class="bg-white rounded-2xl p-5 border border-gray-100 shadow-sm text-center">
                <h3 class="font-bold text-lg text-gray-900" x-text="currentUser.name"></h3>
                <p class="text-xs text-gray-400" x-text="currentUser.email"></p>
                <span class="inline-block mt-2 text-[10px] bg-amber-100 text-amber-800 font-bold px-2.5 py-0.5 rounded-full uppercase" x-text="currentUser.tier || 'Free Tier'"></span>
            </div>
        </main>

        <!-- 4. SETTINGS TAB -->
        <main class="max-w-md mx-auto px-4 pt-4" x-show="currentNav === 'settings'">
            <div class="bg-white rounded-2xl border border-gray-100 shadow-sm divide-y divide-gray-100">
                <button @click="showAdminModal = true" class="w-full p-4 flex items-center justify-between text-left hover:bg-gray-50">
                    <div class="flex items-center space-x-3">
                        <i class="fa-solid fa-user-shield text-amber-600 text-lg"></i>
                        <div>
                            <h4 class="font-bold text-xs text-gray-900">Admin Control Panel</h4>
                            <p class="text-[10px] text-gray-400">Manage upgrade approvals & requests</p>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-xs text-gray-400"></i>
                </button>
                <button @click="handleLogout()" class="w-full p-4 flex items-center justify-between text-left hover:bg-red-50 text-red-600">
                    <span class="font-bold text-xs">Sign Out</span>
                </button>
            </div>
        </main>

        <!-- FIXED BOTTOM NAVIGATION BAR -->
        <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 z-40">
            <div class="max-w-md mx-auto flex justify-around py-2">
                <button @click="currentNav = 'home'" :class="currentNav === 'home' ? 'text-indigo-600 font-bold' : 'text-gray-400'" class="flex flex-col items-center text-[10px]">
                    <i class="fa-solid fa-house text-base"></i><span>Home</span>
                </button>
                <button @click="currentNav = 'earn'" :class="currentNav === 'earn' ? 'text-indigo-600 font-bold' : 'text-gray-400'" class="flex flex-col items-center text-[10px]">
                    <i class="fa-solid fa-briefcase text-base"></i><span>Earn</span>
                </button>
                <button @click="currentNav = 'profile'" :class="currentNav === 'profile' ? 'text-indigo-600 font-bold' : 'text-gray-400'" class="flex flex-col items-center text-[10px]">
                    <i class="fa-solid fa-user text-base"></i><span>Profile</span>
                </button>
                <button @click="currentNav = 'settings'" :class="currentNav === 'settings' ? 'text-indigo-600 font-bold' : 'text-gray-400'" class="flex flex-col items-center text-[10px]">
                    <i class="fa-solid fa-gear text-base"></i><span>Settings</span>
                </button>
            </div>
        </nav>

        <!-- MODAL: UPGRADE WITH PROOF UPLOAD -->
        <div x-show="showUpgradeModal" x-cloak class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
            <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 shadow-2xl relative max-h-[90vh] overflow-y-auto">
                <button @click="showUpgradeModal = false; selectedTierPayment = null;" class="absolute top-4 right-4 text-gray-400">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>

                <h3 class="font-bold text-base text-gray-900 mb-1">Upgrade Account Tier</h3>
                <p class="text-xs text-gray-500 mb-4">Select a tier to unlock higher daily task limits.</p>

                <template x-if="!selectedTierPayment">
                    <div class="space-y-3">
                        <div class="border p-3 rounded-xl flex justify-between items-center border-amber-300 bg-amber-50/50">
                            <div><h4 class="font-bold text-xs text-gray-900">Bronze Worker</h4><p class="text-[10px] text-gray-500">5 Tasks/Day</p></div>
                            <button @click="selectTierForPayment('Bronze', 800)" class="bg-amber-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg">₦800</button>
                        </div>
                        <div class="border p-3 rounded-xl flex justify-between items-center border-slate-300 bg-slate-50/50">
                            <div><h4 class="font-bold text-xs text-gray-900">Silver Worker</h4><p class="text-[10px] text-gray-500">15 Tasks/Day</p></div>
                            <button @click="selectTierForPayment('Silver', 3500)" class="bg-slate-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg">₦3,500</button>
                        </div>
                        <div class="border p-3 rounded-xl flex justify-between items-center border-yellow-400 bg-yellow-50/50">
                            <div><h4 class="font-bold text-xs text-gray-900">Gold VIP</h4><p class="text-[10px] text-gray-500">Unlimited Tasks</p></div>
                            <button @click="selectTierForPayment('Gold', 7500)" class="bg-yellow-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg">₦7,500</button>
                        </div>
                    </div>
                </template>

                <template x-if="selectedTierPayment">
                    <div>
                        <button @click="selectedTierPayment = null" class="text-xs text-indigo-600 font-bold mb-3">← Back to Tiers</button>
                        <div class="bg-gray-100 p-3 rounded-xl text-xs space-y-1 mb-3">
                            <div class="flex justify-between"><span>Bank Name:</span><strong>PARALLEX</strong></div>
                            <div class="flex justify-between"><span>Account Number:</span><strong class="text-indigo-600 font-mono">2003388692</strong></div>
                            <div class="flex justify-between"><span>Account Name:</span><strong class="uppercase" x-text="currentUser.name"></strong></div>
                        </div>

                        <form @submit.prevent="submitUpgradeForApproval()" class="space-y-3">
                            <div>
                                <label class="block text-xs font-semibold text-gray-700 mb-1">Sender Account Name</label>
                                <input type="text" x-model="paymentSenderName" required placeholder="Name on bank app" class="w-full text-xs px-3 py-2 border border-gray-300 rounded-lg">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-700 mb-1">Attach Transfer Screenshot</label>
                                <input type="file" @change="handleFileUpload($event)" accept="image/*" required class="w-full text-xs text-gray-500">
                            </div>
                            <button type="submit" class="w-full bg-emerald-600 text-white font-bold text-xs py-3 rounded-lg">
                                Submit for Admin Approval
                            </button>
                        </form>
                    </div>
                </template>
            </div>
        </div>

        <!-- MODAL: ADMIN APPROVAL DASHBOARD -->
        <div x-show="showAdminModal" x-cloak class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="bg-white w-full max-w-md rounded-2xl p-5 shadow-2xl max-h-[80vh] overflow-y-auto relative">
                <button @click="showAdminModal = false" class="absolute top-4 right-4 text-gray-400"><i class="fa-solid fa-xmark text-lg"></i></button>
                <h3 class="font-bold text-base text-gray-900 mb-3">Admin Pending Approvals</h3>

                <div class="space-y-3">
                    <template x-for="req in adminApprovals" :key="req.id">
                        <div class="border p-3 rounded-xl text-xs space-y-1">
                            <div class="flex justify-between"><strong x-text="req.userName"></strong><span class="text-amber-600 font-bold" x-text="req.tier"></span></div>
                            <p class="text-gray-500">Sender: <span x-text="req.senderName"></span> | Amount: ₦<span x-text="req.amount"></span></p>
                            <template x-if="req.proofImage">
                                <img :src="req.proofImage" class="h-20 w-full object-cover rounded mt-1 border">
                            </template>
                            <div class="flex space-x-2 mt-2">
                                <button @click="approveUpgrade(req)" class="flex-1 bg-emerald-600 text-white py-1 rounded font-bold">Approve</button>
                                <button @click="declineUpgrade(req)" class="flex-1 bg-red-600 text-white py-1 rounded font-bold">Decline</button>
                            </div>
                        </div>
                    </template>
                    <template x-if="adminApprovals.length === 0">
                        <p class="text-center text-xs text-gray-400 py-4">No pending upgrade approvals.</p>
                    </template>
                </div>
            </div>
        </div>
    </div>

    <script>
        function taskApp() {
            return {
                currentNav: 'home',
                isLoggedIn: JSON.parse(localStorage.getItem('qt_user')) ? true : false,
                pendingVerification: false,
                isSendingCode: false,
                verificationCodeInput: '',
                generatedOtp: '',
                
                authMode: 'login',
                authName: '',
                authEmail: '',
                authPassword: '',
                currentUser: JSON.parse(localStorage.getItem('qt_user')) || { name: 'User', email: '', tier: 'Free' },

                selectedCategory: 'All',
                categories: ['All', 'Social Media', 'Mobile Apps', 'Reviews', 'Surveys'],
                selectedTask: null,
                showWithdrawModal: false,
                showReferralModal: false,
                showSupportModal: false,
                showUpgradeModal: false,
                showAdminModal: false,
                selectedTierPayment: null,
                paymentSenderName: '',
                uploadedProofBase64: null,
                
                wallet: JSON.parse(localStorage.getItem('qt_wallet')) || { balance: 1500 },
                submissions: JSON.parse(localStorage.getItem('qt_submissions')) || [],
                adminApprovals: JSON.parse(localStorage.getItem('qt_admin_approvals')) || [],

                tasks: [
                    { id: 1, category: 'Social Media', title: 'Subscribe to YouTube Channel', description: 'Subscribe and enable post notifications.', actionUrl: 'https://youtube.com', reward: 200 },
                    { id: 2, category: 'Mobile Apps', title: 'Download & Test FinTech App', description: 'Install from Play Store and open once.', actionUrl: 'https://play.google.com', reward: 200 },
                    { id: 3, category: 'Reviews', title: 'Leave 5-Star Review on Google Maps', description: 'Write a positive review for local store.', actionUrl: 'https://maps.google.com', reward: 200 }
                ],

                get dailyLimit() {
                    if (this.currentUser.tier === 'Bronze') return 5;
                    if (this.currentUser.tier === 'Silver') return 15;
                    if (this.currentUser.tier === 'Gold') return 999;
                    return 2;
                },

                get todayTaskCount() {
                    const todayStr = new Date().toDateString();
                    return this.submissions.filter(sub => sub.fullDate === todayStr).length;
                },

                get filteredTasks() {
                    if (this.selectedCategory === 'All') return this.tasks;
                    return this.tasks.filter(t => t.category === this.selectedCategory);
                },

                handleFileUpload(event) {
                    const file = event.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (e) => { this.uploadedProofBase64 = e.target.result; };
                        reader.readAsDataURL(file);
                    }
                },

                selectTierForPayment(tierName, price) {
                    this.selectedTierPayment = { name: tierName, price: price };
                },

                submitUpgradeForApproval() {
                    if (!this.paymentSenderName.trim()) return;
                    
                    const newRequest = {
                        id: Date.now(),
                        userEmail: this.currentUser.email,
                        userName: this.currentUser.name,
                        tier: this.selectedTierPayment.name,
                        amount: this.selectedTierPayment.price,
                        senderName: this.paymentSenderName,
                        proofImage: this.uploadedProofBase64
                    };

                    this.adminApprovals.unshift(newRequest);
                    localStorage.setItem('qt_admin_approvals', JSON.stringify(this.adminApprovals));

                    alert('Upgrade transfer submitted! Admin will approve your payment shortly.');
                    this.showUpgradeModal = false;
                    this.selectedTierPayment = null;
                    this.paymentSenderName = '';
                },

                approveUpgrade(req) {
                    if (this.currentUser.email === req.userEmail) {
                        this.currentUser.tier = req.tier;
                        localStorage.setItem('qt_user', JSON.stringify(this.currentUser));
                    }
                    this.adminApprovals = this.adminApprovals.filter(a => a.id !== req.id);
                    localStorage.setItem('qt_admin_approvals', JSON.stringify(this.adminApprovals));
                    alert('Upgrade approved for ' + req.userName + '!');
                },

                declineUpgrade(req) {
                    this.adminApprovals = this.adminApprovals.filter(a => a.id !== req.id);
                    localStorage.setItem('qt_admin_approvals', JSON.stringify(this.adminApprovals));
                    alert('Upgrade request declined.');
                },

                handleLogin() {
                    if (!this.authEmail) return;
                    this.currentUser = { name: this.authEmail.split('@')[0], email: this.authEmail, tier: 'Free' };
                    localStorage.setItem('qt_user', JSON.stringify(this.currentUser));
                    this.isLoggedIn = true;
                },

                initiateSignUp() {
                    if (!this.authName || !this.authEmail) return;
                    this.generatedOtp = Math.floor(1000 + Math.random() * 9000).toString();
                    alert('Verification Code: ' + this.generatedOtp);
                    this.pendingVerification = true;
                },

                verifyEmailCode() {
                    if (this.verificationCodeInput !== this.generatedOtp) return alert('Invalid code');
                    this.currentUser = { name: this.authName, email: this.authEmail, tier: 'Free' };
                    localStorage.setItem('qt_user', JSON.stringify(this.currentUser));
                    this.isLoggedIn = true;
                    this.pendingVerification = false;
                },

                handleLogout() {
                    localStorage.removeItem('qt_user');
                    this.isLoggedIn = false;
                }
            }
        }
    </script>
</body>
</html>
