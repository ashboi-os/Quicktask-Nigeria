<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickTask Nigeria - Micro-Tasking Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 antialiased font-sans min-h-screen pb-20" x-data="taskApp()">

    <!-- AUTHENTICATION, PASSWORD RECOVERY & EMAIL VERIFICATION -->
    <div x-show="!isLoggedIn" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-indigo-900 via-indigo-800 to-purple-900">
        <div class="bg-white w-full max-w-md rounded-2xl p-6 shadow-2xl">
            <div class="text-center mb-6">
                <!-- SECRET ADMIN TRIGGER: Tap 3 times on the bolt icon -->
                <button @click="adminTapCount++; if(adminTapCount >= 3) { openSecretAdmin(); adminTapCount = 0; }" class="w-12 h-12 bg-indigo-600 rounded-2xl flex items-center justify-center text-white shadow-lg mx-auto mb-2 active:scale-95 transition">
                    <i class="fa-solid fa-bolt text-2xl"></i>
                </button>
                <h2 class="text-2xl font-black text-gray-900">QuickTask <span class="text-indigo-600">Nigeria</span></h2>
                <p class="text-xs text-emerald-600 font-bold mt-1">🎁 Get ₦1,500 Welcome Bonus Instantly!</p>
            </div>

            <!-- REGISTRATION / LOGIN / FORGOT PASSWORD MODES -->
            <template x-if="!pendingVerification && !isForgotPass">
                <div>
                    <div class="flex border-b border-gray-200 mb-5 text-xs font-bold text-center">
                        <button @click="authMode = 'login'" :class="authMode === 'login' ? 'border-b-2 border-indigo-600 text-indigo-600' : 'text-gray-400'" class="w-1/2 pb-2 transition">Log In</button>
                        <button @click="authMode = 'signup'" :class="authMode === 'signup' ? 'border-b-2 border-indigo-600 text-indigo-600' : 'text-gray-400'" class="w-1/2 pb-2 transition">Create Account</button>
                    </div>

                    <!-- LOGIN FORM -->
                    <form x-show="authMode === 'login'" @submit.prevent="handleLogin()" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Email Address</label>
                            <input type="email" x-model="authEmail" required placeholder="worker@gmail.com" class="w-full text-xs px-3.5 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <label class="block text-xs font-semibold text-gray-700">Password</label>
                                <button type="button" @click="isForgotPass = true" class="text-[11px] text-indigo-600 font-bold hover:underline">Forgot Password?</button>
                            </div>
                            <input type="password" x-model="authPassword" required placeholder="••••••••" class="w-full text-xs px-3.5 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs py-3 rounded-lg shadow transition flex items-center justify-center space-x-1">
                            <i class="fa-solid fa-right-to-bracket"></i>
                            <span>Log In to Account</span>
                        </button>
                    </form>

                    <!-- SIGN UP FORM -->
                    <form x-show="authMode === 'signup'" @submit.prevent="initiateSignUp()" class="space-y-3">
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Full Name</label>
                            <input type="text" x-model="authName" required placeholder="e.g. Dubem Chidu" class="w-full text-xs px-3.5 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Email Address</label>
                            <input type="email" x-model="authEmail" required placeholder="worker@gmail.com" class="w-full text-xs px-3.5 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Password</label>
                            <input type="password" x-model="authPassword" required placeholder="••••••••" class="w-full text-xs px-3.5 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        <button type="submit" :disabled="isSendingCode" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs py-3 rounded-lg shadow transition flex items-center justify-center space-x-1">
                            <i class="fa-solid opacity-75" :class="isSendingCode ? 'fa-spinner fa-spin' : 'fa-paper-plane'"></i>
                            <span x-text="isSendingCode ? 'Sending Code to Gmail...' : 'Send Verification Code to Gmail'"></span>
                        </button>
                    </form>
                </div>
            </template>

            <!-- FORGOT / RECOVER PASSWORD FORM -->
            <template x-if="isForgotPass && !resetStep">
                <div class="space-y-4">
                    <div class="text-center">
                        <h3 class="font-bold text-gray-900 text-base">Recover Your Account</h3>
                        <p class="text-xs text-gray-500 mt-1">Enter your registered Gmail address to receive a 4-digit recovery code.</p>
                    </div>

                    <form @submit.prevent="sendPasswordResetCode()" class="space-y-3">
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Registered Gmail</label>
                            <input type="email" x-model="resetEmail" required placeholder="worker@gmail.com" class="w-full text-xs px-3.5 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        <button type="submit" :disabled="isSendingCode" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs py-3 rounded-lg shadow transition flex items-center justify-center space-x-1">
                            <i class="fa-solid opacity-75" :class="isSendingCode ? 'fa-spinner fa-spin' : 'fa-envelope'"></i>
                            <span x-text="isSendingCode ? 'Sending Code...' : 'Send Password Reset Code'"></span>
                        </button>
                        <button type="button" @click="isForgotPass = false" class="text-xs text-gray-400 hover:underline block mx-auto text-center">Back to Login</button>
                    </form>
                </div>
            </template>

            <!-- ENTER RESET CODE & NEW PASSWORD -->
            <template x-if="isForgotPass && resetStep === 2">
                <div class="space-y-4">
                    <div class="text-center">
                        <div class="w-10 h-10 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto text-lg mb-2">
                            <i class="fa-solid fa-key"></i>
                        </div>
                        <h3 class="font-bold text-gray-900 text-base">Reset Your Password</h3>
                        <p class="text-xs text-gray-500">We sent a 4-digit code to <span class="font-bold text-indigo-600" x-text="resetEmail"></span>.</p>
                    </div>

                    <form @submit.prevent="confirmPasswordReset()" class="space-y-3">
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">4-Digit Reset Code</label>
                            <input type="text" x-model="resetCodeInput" maxlength="4" required placeholder="Enter code" class="w-full text-center text-lg font-bold tracking-widest px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">New Password</label>
                            <input type="password" x-model="newPassword" required placeholder="New password" class="w-full text-xs px-3.5 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs py-3 rounded-lg shadow transition">
                            Update Password & Log In
                        </button>
                    </form>
                </div>
            </template>

            <!-- EMAIL VERIFICATION CODE ENTRY -->
            <template x-if="pendingVerification">
                <div class="text-center space-y-4">
                    <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-xl">
                        <i class="fa-solid fa-envelope-circle-check"></i>
                    </div>
                    <h3 class="font-bold text-gray-900 text-base">Check Your Gmail Inbox</h3>
                    <p class="text-xs text-gray-500">We sent a 4-digit verification code to <span class="font-bold text-indigo-600" x-text="authEmail"></span>.</p>
                    
                    <input type="text" x-model="verificationCodeInput" maxlength="4" placeholder="Enter code" class="w-40 text-center text-lg font-bold tracking-widest px-3 py-2 border border-gray-300 rounded-lg mx-auto block focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    
                    <button @click="verifyEmailCode()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs py-3 rounded-lg shadow transition">
                        Verify & Claim ₦1,500 Bonus
                    </button>
                    <button @click="pendingVerification = false" class="text-xs text-gray-400 hover:underline block mx-auto">Change Email</button>
                </div>
            </template>
        </div>
    </div>

    <!-- MAIN APP DASHBOARD -->
    <div x-show="isLoggedIn" x-cloak>
        <!-- TOP HEADER -->
        <header class="bg-white border-b border-gray-200 sticky top-0 z-30 shadow-sm">
            <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <button @click="adminTapCount++; if(adminTapCount >= 3) { openSecretAdmin(); adminTapCount = 0; }" class="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-md active:scale-95 transition">
                        <i class="fa-solid fa-bolt text-lg"></i>
                    </button>
                    <div>
                        <h1 class="font-extrabold text-lg leading-tight text-gray-900">QuickTask</h1>
                        <div class="flex items-center space-x-1">
                            <span class="text-[10px] bg-emerald-100 text-emerald-800 font-bold px-1.5 py-0.5 rounded-full uppercase tracking-wider">Nigeria</span>
                            <span class="text-[10px] text-gray-400 font-semibold truncate max-w-[90px]" x-text="currentUser.name"></span>
                        </div>
                    </div>
                </div>

                <div class="flex items-center space-x-2">
                    <button @click="showWithdrawModal = true" class="bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 rounded-xl px-3 py-1 text-right shadow-inner transition">
                        <div class="text-xs font-extrabold text-emerald-700 flex items-center justify-end space-x-0.5">
                            <span>₦</span><span x-text="wallet.balance.toLocaleString()"></span>
                        </div>
                        <div class="text-[9px] text-indigo-600 font-semibold">
                            <i class="fa-solid fa-wallet"></i> Withdraw
                        </div>
                    </button>
                </div>
            </div>
        </header>

        <!-- HOME TAB -->
        <main class="max-w-md mx-auto px-4 pt-4" x-show="currentNav === 'home'">
            <div class="bg-gradient-to-r from-indigo-600 to-violet-600 rounded-2xl p-5 text-white shadow-lg relative overflow-hidden mb-4">
                <div class="relative z-10">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-xs text-indigo-200 font-semibold">Tier: <strong class="text-amber-300 uppercase" x-text="currentUser.tier || 'Free Tier'"></strong></span>
                        <span class="text-[10px] bg-white/25 px-2 py-0.5 rounded-full backdrop-blur-sm">Payout: 20th Monthly</span>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-3 mb-3">
                        <div class="bg-white/10 p-2.5 rounded-xl backdrop-blur-sm border border-white/10">
                            <span class="text-[10px] text-indigo-200 block">Total Balance</span>
                            <span class="text-base font-extrabold">₦<span x-text="wallet.balance.toLocaleString()"></span></span>
                        </div>
                        <div class="bg-white/10 p-2.5 rounded-xl backdrop-blur-sm border border-white/10">
                            <span class="text-[10px] text-indigo-200 block">Daily Limit</span>
                            <span class="text-base font-extrabold"><span x-text="todayTaskCount"></span> / <span x-text="dailyLimit === 999 ? '∞' : dailyLimit"></span> Done</span>
                        </div>
                    </div>

                    <div class="flex space-x-2">
                        <button @click="showUpgradeModal = true" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold py-2 rounded-lg transition shadow-sm flex items-center justify-center space-x-1">
                            <i class="fa-solid fa-crown"></i>
                            <span>Upgrade Tier</span>
                        </button>
                        <button @click="showReferralModal = true" class="bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-semibold px-3 py-2 rounded-lg transition shadow-sm flex items-center space-x-1">
                            <i class="fa-solid fa-users"></i>
                            <span>Refer & Earn</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3 mb-4">
                <button @click="currentNav = 'earn'" class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm text-left hover:border-indigo-500 transition">
                    <i class="fa-solid fa-briefcase text-indigo-600 text-xl mb-1"></i>
                    <h4 class="font-bold text-xs text-gray-900">Available Tasks</h4>
                    <p class="text-[10px] text-gray-400">Earn ₦200 per completed job</p>
                </button>
                <button @click="showWithdrawModal = true" class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm text-left hover:border-emerald-500 transition">
                    <i class="fa-solid fa-building-columns text-emerald-600 text-xl mb-1"></i>
                    <h4 class="font-bold text-xs text-gray-900">Bank Withdrawal</h4>
                    <p class="text-[10px] text-gray-400">Min ₦7,000 threshold</p>
                </button>
            </div>
        </main>

        <!-- EARN TAB -->
        <main class="max-w-md mx-auto px-4 pt-4" x-show="currentNav === 'earn'">
            <template x-if="todayTaskCount >= dailyLimit">
                <div class="bg-amber-50 border border-amber-200 rounded-xl p-3 mb-3 flex items-center space-x-2 text-xs text-amber-800">
                    <i class="fa-solid fa-circle-info text-amber-600 text-base"></i>
                    <div>
                        <strong class="block font-bold">Daily Free Limit Reached!</strong>
                        <span>Completed <span x-text="todayTaskCount"></span>/<span x-text="dailyLimit"></span> tasks today. <strong class="text-indigo-600 cursor-pointer underline" @click="showUpgradeModal = true">Upgrade tier</strong> to perform more tasks!</span>
                    </div>
                </div>
            </template>

            <div class="flex space-x-2 overflow-x-auto pb-2 scrollbar-none">
                <template x-for="cat in categories" :key="cat">
                    <button @click="selectedCategory = cat" 
                            :class="selectedCategory === cat ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white text-gray-600 border border-gray-200 hover:bg-gray-100'"
                            class="text-xs font-semibold px-3 py-1.5 rounded-full whitespace-nowrap transition">
                        <span x-text="cat"></span>
                    </button>
                </template>
            </div>

            <div class="space-y-3 mt-3">
                <template x-for="task in filteredTasks" :key="task.id">
                    <div class="bg-white rounded-xl p-4 border border-gray-100 shadow-sm hover:shadow-md transition">
                        <div class="flex items-start justify-between">
                            <div>
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-indigo-50 text-indigo-600" x-text="task.category"></span>
                                <h3 class="font-bold text-sm text-gray-900 mt-2" x-text="task.title"></h3>
                                <p class="text-xs text-gray-500 mt-1" x-text="task.description"></p>
                            </div>
                            <div class="text-right ml-2 flex-shrink-0">
                                <span class="font-extrabold text-emerald-600 text-sm">₦200</span>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-2 mt-4">
                            <a :href="task.link" target="_blank" class="bg-gray-100 hover:bg-gray-200 text-gray-800 font-semibold text-xs py-2.5 rounded-lg transition text-center flex items-center justify-center space-x-1">
                                <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                                <span>Open Task Link</span>
                            </a>
                            <button @click="openTaskModal(task)" :disabled="todayTaskCount >= dailyLimit" :class="todayTaskCount >= dailyLimit ? 'bg-gray-300 text-gray-500 cursor-not-allowed' : 'bg-indigo-600 hover:bg-indigo-700 text-white shadow'" class="font-semibold text-xs py-2.5 rounded-lg transition flex items-center justify-center space-x-1">
                                <i class="fa-solid fa-cloud-arrow-up"></i>
                                <span x-text="todayTaskCount >= dailyLimit ? 'Upgrade Required' : 'Submit Proof'"></span>
                            </button>
                        </div>
                    </div>
                </template>
            </div>
        </main>

        <!-- PROFILE TAB -->
        <main class="max-w-md mx-auto px-4 pt-4" x-show="currentNav === 'profile'">
            <div class="bg-white rounded-2xl p-5 border border-gray-100 shadow-sm mb-4 text-center">
                <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center text-2xl mx-auto mb-2 font-black">
                    <span x-text="currentUser.name ? currentUser.name[0].toUpperCase() : 'U'"></span>
                </div>
                <h3 class="font-bold text-lg text-gray-900" x-text="currentUser.name"></h3>
                <p class="text-xs text-gray-400" x-text="currentUser.email"></p>
                <span class="inline-block mt-2 text-[10px] bg-amber-100 text-amber-800 font-bold px-2.5 py-0.5 rounded-full uppercase" x-text="currentUser.tier || 'Free Tier'"></span>
            </div>
        </main>

        <!-- SETTINGS TAB -->
        <main class="max-w-md mx-auto px-4 pt-4" x-show="currentNav === 'settings'">
            <div class="bg-white rounded-2xl border border-gray-100 shadow-sm divide-y divide-gray-100">
                <button @click="showSupportModal = true" class="w-full p-4 flex items-center justify-between text-left hover:bg-gray-50">
                    <div class="flex items-center space-x-3">
                        <i class="fa-solid fa-headset text-indigo-600 text-lg"></i>
                        <div>
                            <h4 class="font-bold text-xs text-gray-900">Customer Support</h4>
                            <p class="text-[10px] text-gray-400">Open ticket or ask questions</p>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-xs text-gray-400"></i>
                </button>

                <button @click="handleLogout()" class="w-full p-4 flex items-center justify-between text-left hover:bg-red-50 text-red-600">
                    <div class="flex items-center space-x-3">
                        <i class="fa-solid fa-right-from-bracket text-lg"></i>
                        <span class="font-bold text-xs">Sign Out</span>
                    </div>
                </button>
            </div>
        </main>

        <!-- FIXED BOTTOM NAVIGATION BAR -->
        <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 z-40">
            <div class="max-w-md mx-auto flex justify-around py-2">
                <button @click="currentNav = 'home'" :class="currentNav === 'home' ? 'text-indigo-600 font-bold' : 'text-gray-400'" class="flex flex-col items-center text-[10px] space-y-0.5">
                    <i class="fa-solid fa-house text-base"></i>
                    <span>Home</span>
                </button>
                <button @click="currentNav = 'earn'" :class="currentNav === 'earn' ? 'text-indigo-600 font-bold' : 'text-gray-400'" class="flex flex-col items-center text-[10px] space-y-0.5">
                    <i class="fa-solid fa-briefcase text-base"></i>
                    <span>Earn</span>
                </button>
                <button @click="currentNav = 'profile'" :class="currentNav === 'profile' ? 'text-indigo-600 font-bold' : 'text-gray-400'" class="flex flex-col items-center text-[10px] space-y-0.5">
                    <i class="fa-solid fa-user text-base"></i>
                    <span>Profile</span>
                </button>
                <button @click="currentNav = 'settings'" :class="currentNav === 'settings' ? 'text-indigo-600 font-bold' : 'text-gray-400'" class="flex flex-col items-center text-[10px] space-y-0.5">
                    <i class="fa-solid fa-gear text-base"></i>
                    <span>Settings</span>
                </button>
            </div>
        </nav>
    </div>

    <!-- ALPINE.JS CONTROLLER SCRIPT -->
    <script>
        // Initialize EmailJS (Replace 'YOUR_PUBLIC_KEY' with your EmailJS key)
        (function() {
            emailjs.init("YOUR_PUBLIC_KEY");
        })();

        function taskApp() {
            return {
                currentNav: 'home',
                isLoggedIn: JSON.parse(localStorage.getItem('qt_user')) ? true : false,
                pendingVerification: false,
                isForgotPass: false,
                resetStep: null,
                isSendingCode: false,
                verificationCodeInput: '',
                generatedOtp: '',
                resetEmail: '',
                resetCodeInput: '',
                newPassword: '',
                
                authMode: 'login',
                authName: '',
                authEmail: '',
                authPassword: '',
                currentUser: JSON.parse(localStorage.getItem('qt_user')) || { name: 'User', email: '', tier: 'Free' },

                selectedCategory: 'All',
                categories: ['All', 'Social Media', 'Mobile Apps', 'Reviews', 'Surveys'],
                selectedTask: null,
                showWithdrawModal: false,
                showReferralModal: false,
                showSupportModal: false,
                showUpgradeModal: false,
                showAdminModal: false,
                adminTapCount: 0,
                selectedTierPayment: null,
                
                wallet: JSON.parse(localStorage.getItem('qt_wallet')) || { balance: 1500 },
                submissions: JSON.parse(localStorage.getItem('qt_submissions')) || [],

                tasks: [
                    { id: 1, category: 'Social Media', title: 'Subscribe to Official YouTube Channel', description: 'Subscribe and enable bell notifications.', instructions: 'Subscribe to channel, upload screenshot proof.', link: 'https://youtube.com', reward: 200 },
                    { id: 2, category: 'Mobile Apps', title: 'Download & Test FinTech App', description: 'Install from Play Store and open.', instructions: 'Install app, open once, upload screenshot proof.', link: 'https://play.google.com', reward: 200 },
                    { id: 3, category: 'Reviews', title: 'Leave 5-Star Review on Google Maps', description: 'Write positive store review.', instructions: 'Leave 5 stars review, upload screenshot proof.', link: 'https://maps.google.com', reward: 200 }
                ],

                get dailyLimit() {
                    if (this.currentUser.tier === 'Bronze') return 5;
                    if (this.currentUser.tier === 'Silver') return 15;
                    if (this.currentUser.tier === 'Gold') return 999;
                    return 2;
                },

                get todayTaskCount() {
                    const todayStr = new Date().toDateString();
                    return this.submissions.filter(sub => sub.fullDate === todayStr).length;
                },

                get filteredTasks() {
                    if (this.selectedCategory === 'All') return this.tasks;
                    return this.tasks.filter(t => t.category === this.selectedCategory);
                },

                handleLogin() {
                    if (!this.authEmail) return;
                    const savedUsers = JSON.parse(localStorage.getItem('qt_accounts') || '{}');
                    
                    if (savedUsers[this.authEmail] && savedUsers[this.authEmail].password !== this.authPassword) {
                        alert('Incorrect password! Click "Forgot Password?" to reset.');
                        return;
                    }

                    const userName = this.authEmail.split('@')[0];
                    this.currentUser = { name: userName, email: this.authEmail, tier: 'Free' };
                    localStorage.setItem('qt_user', JSON.stringify(this.currentUser));
                    this.isLoggedIn = true;
                },

                async initiateSignUp() {
                    if (!this.authName || !this.authEmail) return;
                    this.isSendingCode = true;
                    this.generatedOtp = Math.floor(1000 + Math.random() * 9000).toString();
                    
                    // Send real email via EmailJS (optional integration)
                    try {
                        /*
                        await emailjs.send("YOUR_SERVICE_ID", "YOUR_TEMPLATE_ID", {
                            to_email: this.authEmail,
                            to_name: this.authName,
                            reset_code: this.generatedOtp
                        });
                        */
                    } catch(e) { console.log(e); }

                    alert('Verification Code sent to ' + this.authEmail + '! (Your Code is: ' + this.generatedOtp + ')');
                    this.pendingVerification = true;
                    this.isSendingCode = false;
                },

                verifyEmailCode() {
                    if (this.verificationCodeInput !== this.generatedOtp) {
                        alert('Invalid verification code!');
                        return;
                    }
                    this.currentUser = { name: this.authName, email: this.authEmail, tier: 'Free' };
                    this.wallet.balance = 1500;
                    
                    // Save account details
                    const savedUsers = JSON.parse(localStorage.getItem('qt_accounts') || '{}');
                    savedUsers[this.authEmail] = { password: this.authPassword, name: this.authName };
                    localStorage.setItem('qt_accounts', JSON.stringify(savedUsers));

                    localStorage.setItem('qt_user', JSON.stringify(this.currentUser));
                    localStorage.setItem('qt_wallet', JSON.stringify(this.wallet));
                    this.isLoggedIn = true;
                    this.pendingVerification = false;
                    alert('Gmail verified! ₦1,500 welcome bonus credited.');
                },

                async sendPasswordResetCode() {
                    if (!this.resetEmail) return;
                    this.isSendingCode = true;
                    this.generatedOtp = Math.floor(1000 + Math.random() * 9000).toString();

                    alert('Password reset code sent to ' + this.resetEmail + '! (Code: ' + this.generatedOtp + ')');
                    this.resetStep = 2;
                    this.isSendingCode = false;
                },

                confirmPasswordReset() {
                    if (this.resetCodeInput !== this.generatedOtp) {
                        alert('Invalid reset code!');
                        return;
                    }
                    
                    // Update password
                    const savedUsers = JSON.parse(localStorage.getItem('qt_accounts') || '{}');
                    if (savedUsers[this.resetEmail]) {
                        savedUsers[this.resetEmail].password = this.newPassword;
                        localStorage.setItem('qt_accounts', JSON.stringify(savedUsers));
                    }

                    alert('Password successfully updated! You can now log in.');
                    this.isForgotPass = false;
                    this.resetStep = null;
                },

                handleLogout() {
                    localStorage.removeItem('qt_user');
                    this.isLoggedIn = false;
                },

                openSecretAdmin() {
                    const pass = prompt('Enter Secret Admin Passcode:');
                    if (pass === 'admin123') {
                        alert('Welcome Admin!');
                    } else if (pass !== null) {
                        alert('Access Denied: Incorrect Passcode');
                    }
                }
            }
        }
    </script>
</body>
